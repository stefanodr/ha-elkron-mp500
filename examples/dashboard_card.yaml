      - padding: 2px 0
      grid:
      - grid-template-areas: '"i" "n"'
      - grid-template-rows: 14px min-content
      icon:
      - width: 12px
      - color: '#4b5563'
      name:
      - color: '#9ba8bd'
      - font-size: 8px
      - letter-spacing: 1px
      - font-weight: bold
    state:
    - value: unavailable
      styles:
        icon:
        - color: '#ff5252'
