# Elkron MP500 - esempio di card per la dashboard / example dashboard card
# Richiede / requires: HACS -> button-card, stack-in-card, card-mod, Browser Mod.
# - Nomi e stati degli ingressi vengono letti da Home Assistant / names and states come from Home Assistant.
# - Se la tua centrale ha meno ingressi, cancella i riquadri in piu' / delete the extra tiles if you have fewer inputs.
# - DISINSERISCI apre un tastierino: chiede il codice solo se lo hai impostato nelle Opzioni
#   dell'integrazione / DISINSERISCI opens a keypad: the code is only checked if you set one in the options.
type: custom:stack-in-card
mode: vertical
keep:
  background: true
  border_radius: true
  margin: true
  box_shadow: false
card_mod:
  style: "ha-card {\n  background: #171c27 !important;\n  border: 1px solid #343d50 !important;\n  border-radius: 16px !important;\n  padding: 12px !important;\n  box-shadow: none !important;\n  overflow:\
    \ hidden;\n}\n"
cards:
- type: custom:button-card
  entity: alarm_control_panel.elkron_mp500_sistema
  name: DISINSERITO
  label: ELKRON MP500
  show_icon: false
  show_state: false
  show_label: true
  tap_action:
    action: more-info
  styles:
    card:
    - background: linear-gradient(#0f2a3f,
    - border: 2px solid
    - border-radius: 10px
    - box-shadow: inset 0 0 18px rgba(79,195,247,.2)
    - padding: 12px 14px
    grid:
    - grid-template-areas: '"l" "n"'
    - text-align: left
    label:
    - justify-self: start
    - color: '#8fe3ff'
    - font-size: 11px
    - letter-spacing: 2px
    - opacity: 0.8
    - font-family: monospace
    name:
    - justify-self: start
    - color: '#8fe3ff'
    - font-size: 22px
    - letter-spacing: 1px
    - padding-top: 6px
    - font-family: monospace
  state:
  - value: armed_away
    name: INSERITO
    styles:
      name:
      - color: '#ff8a80'
  - value: armed_custom_bypass
    name: INSERITO PARZIALE
    styles:
      name:
      - color: '#ffe082'
  - value: triggered
    name: ALLARME
    styles:
      name:
      - color: '#ff5252'
  - value: unavailable
    name: NON DISPONIBILE
    styles:
      name:
      - color: '#ff8a80'
- type: grid
  columns: 3
  square: false
  card_mod:
    style: "ha-card {\n  background: transparent !important;\n  border: none !important;\n  box-shadow: none !important;\n  padding: 0 !important;\n}\n#root {\n  gap: 6px !important;\n}\n"
  cards:
  - type: custom:button-card
    entity: alarm_control_panel.elkron_mp500_sistema
    name: RETE
    icon: mdi:circle
    show_state: false
    tap_action:
      action: none
    styles:
      card:
      - background: transparent
      - border: none
      - box-shadow: none
      - padding: 2px 0
      grid:
      - grid-template-areas: '"i" "n"'
      - grid-template-rows: 14px min-content
      icon:
      - width: 12px
      - color: '#2fd06b'
      name:
      - color: '#9ba8bd'
      - font-size: 8px
      - letter-spacing: 1px
      - font-weight: bold
    state:
    - value: unavailable
      styles:
        icon:
        - color: '#ff5252'
  - type: custom:button-card
    entity: alarm_control_panel.elkron_mp500_sistema
