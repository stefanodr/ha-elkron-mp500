# Elkron MP500 - esempio di card per la dashboard / example dashboard card
# Richiede / requires: HACS -> button-card, stack-in-card, card-mod, Browser Mod.
# - Nomi e stati degli ingressi vengono letti da Home Assistant / names and states come from Home Assistant.
# - Se la tua centrale ha meno ingressi, cancella i riquadri in piu' / delete the extra tiles if you have fewer inputs.
# - DISINSERISCI apre un tastierino: chiede il codice solo se lo hai impostato nelle Opzioni
#   dell'integrazione / DISINSERISCI opens a keypad: the code is only checked if you set one in the options.
type: custom:stack-in-card
mode: vertical
keep:
  background: true
  border_radius: true
  margin: true
  box_shadow: false
card_mod:
  style: "ha-card {\n  background: #171c27 !important;\n  border: 1px solid #343d50 !important;\n  border-radius: 16px !important;\n  padding: 12px !important;\n  box-shadow: none !important;\n  overflow: hidden;\n}\n"
cards:
- type: custom:button-card
  entity: alarm_control_panel.elkron_mp500_sistema
  name: ALLARME DISINSERITO
  label: ELKRON MP500
  show_icon: false
  show_state: false
  show_label: true
  tap_action:
    action: more-info
  styles:
    card:
    - background: 'linear-gradient(180deg, #0c2538 0%, #08141f 100%)'
    - border: '3px solid #1b2a3a'
    - border-radius: 12px
    - overflow: hidden
    - padding: 10px 0 8px 0
    - box-shadow: inset 0 0 22px rgba(79,195,247,.28), inset 0 3px 8px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.08)
    grid:
    - grid-template-areas: l" "n
    - grid-template-columns: 1fr
    - text-align: left
    label:
    - color: '#5fb8d6'
    - font-size: 14px
    - letter-spacing: 3px
    - opacity: '0.75'
    - font-family: '"VT323", "Share Tech Mono", "Lucida Console", monospace'
    - text-align: center
    - justify-self: center
    name:
    - color: '#8fe3ff'
    - line-height: '1.05'
    - font-family: '"VT323", "Share Tech Mono", "Lucida Console", monospace'
    - text-shadow: 0 0 6px rgba(143,227,255,.85), 0 0 14px rgba(79,195,247,.45)
    - display: block
    - text-align: center
    - white-space: nowrap
    - letter-spacing: 2px
    - justify-self: center
    - font-size: 26px
  state:
  - value: armed_away
    name: ALLARME INSERITO
    styles:
      name:
      - color: '#ff8a80'
      - text-shadow: 0 0 6px rgba(255,138,128,.85), 0 0 14px rgba(255,82,82,.45)
  - value: armed_custom_bypass
    name: ALLARME INSERITO PARZIALE
    styles:
      name:
      - color: '#ffe082'
      - text-shadow: 0 0 6px rgba(255,224,130,.85), 0 0 14px rgba(255,202,40,.45)
      - font-size: 20px
  - value: triggered
    name: '!!! ALLARME IN CORSO !!!'
    styles:
      name:
      - color: '#ff5252'
      - text-shadow: 0 0 8px rgba(255,82,82,.95), 0 0 18px rgba(255,23,68,.6)
      - font-size: 20px
  - value: unavailable
    name: CENTRALE NON DISPONIBILE
    styles:
      name:
      - color: '#9ba8bd'
      - text-shadow: none
      - font-size: 20px
  extra_styles: '@import url(''https://fonts.googleapis.com/css2?family=VT323&display=swap'');

    '
- type: grid
  columns: 2
  square: false
  card_mod:
    style: "ha-card {\n  background: transparent !important;\n  border: none !important;\n  box-shadow: none !important;\n  padding: 0 !important;\n}\n#root {\n  gap: 6px !important;\n}\n"
  cards:
  - type: custom:button-card
    entity: switch.elkron_mp500_connessione
    name: RETE
    icon: mdi:circle
    show_state: false
    tap_action:
      action: toggle
    styles:
      card:
      - background: transparent
      - border: none
      - box-shadow: none
      - padding: 2px 0
      grid:
      - grid-template-areas: '"i" "n"'
      - grid-template-rows: 14px min-content
      icon:
      - width: 12px
      - color: '#2fd06b'
      name:
      - color: '#9ba8bd'
      - font-size: 8px
      - letter-spacing: 1px
      - font-weight: bold
    state:
    - value: 'off'
      name: IN PAUSA
      styles:
        icon:
        - color: '#e0a800'
    - value: unavailable
      styles:
        icon:
        - color: '#ff5252'
  - type: custom:button-card
    entity: alarm_control_panel.elkron_mp500_sistema
    name: SISTEMA
    icon: mdi:circle
    show_state: false
    tap_action:
      action: none
    styles:
      card:
      - background: transparent
      - border: none
      - box-shadow: none
      - padding: 2px 0
      grid:
      - grid-template-areas: '"i" "n"'
      - grid-template-rows: 14px min-content
      icon:
      - width: 12px
      - color: '#2fd06b'
      name:
      - color: '#9ba8bd'
      - font-size: 8px
      - letter-spacing: 1px
      - font-weight: bold
    state:
    - value: armed_away
      styles:
        icon:
        - color: '#ff5252'
    - value: armed_custom_bypass
      styles:
        icon:
        - color: '#ffca28'
    - value: triggered
      styles:
        icon:
        - color: '#ff1744'
    - value: unavailable
      styles:
        icon:
        - color: '#6b7280'
