- type: grid
  columns: 3
  square: false
  card_mod:
    style: "ha-card {\n  background: transparent !important;\n  border: none !important;\n  box-shadow: none !important;\n  padding: 0 !important;\n}\n#root {\n  gap: 6px !important;\n}\n"
  cards:
  - type: custom:button-card
    entity: binary_sensor.elkron_mp500_ingresso_1
    name: '[[[ var m = (entity.attributes.friendly_name || '''').match(/\((.*)\)/); return m ? m[1] : ''Ingresso 1''; ]]]'
    show_state: true
    show_last_changed: true
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Ingresso 1
          size: normal
          dismissable: true
          content:
            type: vertical-stack
            cards:
            - type: history-graph
              hours_to_show: 24
              entities:
              - binary_sensor.elkron_mp500_ingresso_1
            - type: logbook
              hours_to_show: 72
              entities:
              - binary_sensor.elkron_mp500_ingresso_1
    hold_action:
      action: more-info
    styles:
      card:
      - background: transparent
      - border: '1px solid #525b6b'
      - border-radius: 8px
