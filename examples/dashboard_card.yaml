      - padding: 2px 0
      grid:
      - grid-template-areas: '"i" "n"'
      - grid-template-rows: 14px min-content
      icon:
      - width: 12px
      - color: '#2fd06b'
      name:
      - color: '#9ba8bd'
      - font-size: 8px
      - letter-spacing: 1px
      - font-weight: bold
    state:
    - value: armed_away
      styles:
        icon:
        - color: '#ff5252'
    - value: armed_custom_bypass
      styles:
        icon:
        - color: '#ffca28'
    - value: triggered
      styles:
        icon:
        - color: '#ff1744'
    - value: unavailable
      styles:
        icon:
        - color: '#6b7280'
  - type: custom:button-card
    entity: alarm_control_panel.elkron_mp500_sistema
    name: GUASTO
    icon: mdi:circle
    show_state: false
    tap_action:
      action: none
    styles:
